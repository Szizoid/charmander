[package]
name = "charmander"
version = "0.4.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Type accented and special characters on Wayland by holding a key and pressing a modifier"
repository = "https://github.com/Szizoid/charmander"
readme = "README.md"
keywords = ["wayland", "evdev", "uinput", "accent", "unicode"]
categories = ["accessibility", "os::linux-apis"]

[dependencies]
evdev = "0.13.2"
iced = "0.14.0"
iced_layershell = "0.19.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
